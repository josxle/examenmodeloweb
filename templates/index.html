<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Predicción de Cáncer de Pulmón</title>
</head>
<body>
  <div class="container">
    <h1>Predicción de Cáncer de Pulmón</h1>
    <form method="POST">

      <label>Género</label>
      <select name="gender" required>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>

      <label>Edad</label>
      <input type="number" name="age" min="1" max="120" required>

      <label>¿Fuma?</label>
      <select name="smoking" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Dedos amarillos</label>
      <select name="yellow_fingers" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Ansiedad</label>
      <select name="anxiety" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Presión de grupo</label>
      <select name="peer_pressure" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Enfermedad crónica</label>
      <select name="chronic_disease" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Fatiga</label>
      <select name="fatigue" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Alergias</label>
      <select name="allergy" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Sibilancias (wheezing)</label>
      <select name="wheezing" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Consumo de alcohol</label>
      <select name="alcohol_consuming" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Tos frecuente</label>
      <select name="coughing" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Dificultad para respirar</label>
      <select name="shortness_breath" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Dificultad al tragar</label>
      <select name="swallowing_difficulty" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <label>Dolor en el pecho</label>
      <select name="chest_pain" required>
        <option value="1">Sí</option>
        <option value="2">No</option>
      </select>

      <button type="submit">Predecir</button>
    </form>

    {% if prediction_text %}
    <div class="result">{{ prediction_text }}</div>
    {% endif %}
  </div>
</body>
</html>
