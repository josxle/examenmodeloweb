<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicción de Cáncer de Pulmón</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <div class="form-card">
      <h1>Predicción de Cáncer de Pulmón</h1>
      <p class="description">
        Completa el siguiente formulario para estimar el nivel de riesgo basado en tus características y hábitos.
      </p>

      <form action="/predict" method="post">
        <div class="form-grid">
          <div class="form-group">
            <label>Género</label>
            <select name="GENDER" required>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
            </select>
          </div>

          <div class="form-group">
            <label>Edad</label>
            <input type="number" name="AGE" min="1" max="120" placeholder="Ejemplo: 45" required>
          </div>

          <div class="form-group"><label>¿Eres fumador?</label><select name="SMOKING" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Tienes los dedos amarillos?</label><select name="YELLOW_FINGERS" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Sufres de ansiedad?</label><select name="ANXIETY" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Sientes presión social para fumar?</label><select name="PEER_PRESSURE" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Tienes una enfermedad crónica?</label><select name="CHRONIC_DISEASE" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Sientes fatiga frecuente?</label><select name="FATIGUE" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Tienes alergias?</label><select name="ALLERGY" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Tienes sibilancias (silbidos al respirar)?</label><select name="WHEEZING" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Consumes alcohol?</label><select name="ALCOHOL_CONSUMING" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Tienes tos frecuente?</label><select name="COUGHING" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Tienes dificultad para respirar?</label><select name="SHORTNESS_OF_BREATH" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Tienes dificultad para tragar?</label><select name="SWALLOWING_DIFFICULTY" required><option value="2">Sí</option><option value="1">No</option></select></div>
          <div class="form-group"><label>¿Sufres dolor en el pecho?</label><select name="CHEST_PAIN" required><option value="2">Sí</option><option value="1">No</option></select></div>
        </div>

        <div class="form-actions">
          <button type="submit">Predecir Riesgo</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
